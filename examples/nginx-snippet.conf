# nginx-snippet.conf
#
# Example nginx configuration for crawler-log-analyser.
#
# Two parts:
#   1. The seo_crawl log_format definition (goes in nginx.conf or
#      /etc/nginx/conf.d/log-formats.conf — must be inside the http {} block)
#   2. Per-server access_log directives (go inside each server {} block
#      you want to analyse)
#
# The analyser supports two log formats:
#   - combined  (standard nginx): no additional config needed
#   - seo_crawl (extended):       use the format definition below
#
# Both formats can be written in parallel to two separate log files,
# letting the standard combined log feed normal log tooling while the
# seo_crawl log feeds crawler-log-analyser's richer features.

# ====================================================================
# 1. log_format definition
# ====================================================================
#
# Goes in /etc/nginx/conf.d/log-formats.conf (loaded automatically by
# nginx.conf's include directive at the http{} level).
#
# Adds $host, $scheme, $request_time, $upstream_response_time to the
# standard combined format. This lets the analyser:
#   - distinguish apex vs www requests
#   - distinguish http vs https requests
#   - attribute redirects concretely (HTTP→HTTPS vs www→apex vs trailing-slash)
#   - track per-request latency
#   - separate nginx vs upstream contribution to response time

log_format seo_crawl '$remote_addr $host $scheme - [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     '$request_time $upstream_response_time';


# ====================================================================
# 2. Per-server access_log directives
# ====================================================================
#
# Replace <fqdn> with your site's fully-qualified domain name
# (e.g. example.com, www.example.com, blog.example.com).
#
# Both directives can be active simultaneously — nginx writes each
# request to both files.

server {
    # ... your existing listen, server_name, ssl_certificate, etc ...

    # Standard combined log (compatible with any log analyser)
    access_log /var/log/nginx/<fqdn>.access.log combined;

    # Extended seo_crawl log (analyser uses the richer fields when present)
    access_log /var/log/nginx/<fqdn>.seo.log    seo_crawl;

    # Per-site error log (recommended for clarity in multi-site setups)
    error_log  /var/log/nginx/<fqdn>.error.log;

    # ... rest of server block ...
}


# ====================================================================
# 3. File permissions
# ====================================================================
#
# Create the log files with appropriate ownership before reloading nginx,
# otherwise the first write will use whatever user nginx is running as
# and you may end up with inconsistent ownership across log files.

# sudo touch /var/log/nginx/<fqdn>.access.log
# sudo touch /var/log/nginx/<fqdn>.seo.log
# sudo touch /var/log/nginx/<fqdn>.error.log
# sudo chown www-data:adm /var/log/nginx/<fqdn>.{access,seo,error}.log
# sudo chmod 0640 /var/log/nginx/<fqdn>.{access,seo,error}.log

# Then validate and reload:
# sudo nginx -t && sudo systemctl reload nginx
